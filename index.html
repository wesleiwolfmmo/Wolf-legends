<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Legend Wolf Online</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>

:root{
 --bg:#020617;
 --gold:#FFD700;
 --purple:#800080;
}

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

body{
 background:linear-gradient(
 180deg,
 #020617,
 #0f172a
 );

 color:white;
 font-family:'Cinzel',serif;
 min-height:100vh;

 display:flex;
 justify-content:center;
 align-items:center;
}

.screen{
 display:none;
 width:95%;
 max-width:900px;
}

.active{
 display:block;
}

.card{

 background:rgba(255,255,255,.05);

 border:1px solid rgba(255,215,0,.2);

 border-radius:20px;

 padding:30px;

 backdrop-filter:blur(10px);

 box-shadow:
 0 0 20px rgba(128,0,128,.2);
}

h1{
 text-align:center;
 color:var(--gold);
 margin-bottom:20px;
}

.buttons{
 display:flex;
 gap:15px;
 justify-content:center;
 margin-top:25px;
}

button{

 background:linear-gradient(
 45deg,
 var(--purple),
 var(--gold)
 );

 border:none;

 color:white;

 padding:12px 25px;

 border-radius:10px;

 cursor:pointer;
}

.option-grid{

 display:grid;

 grid-template-columns:
 repeat(auto-fit,minmax(180px,1fr));

 gap:20px;
}

.option{

 border:1px solid #444;

 border-radius:15px;

 padding:20px;

 text-align:center;

 cursor:pointer;

 transition:.3s;
}

.option:hover{

 transform:scale(1.05);

 border-color:gold;
}

.selected{

 border:2px solid gold;

 box-shadow:
 0 0 20px gold;
}

input{

 width:100%;

 padding:15px;

 border-radius:10px;

 border:none;

 margin-top:10px;
}

</style>
</head>

<body>

<div id="intro" class="screen active">

<div class="card">

<h1>LEGEND WOLF ONLINE</h1>

<p>
Liberdade ou Tirania?
O destino é seu.
</p>

<div class="buttons">
<button onclick="next('story')">
Iniciar Jornada
</button>
</div>

</div>
</div>

<div id="story" class="screen">

<div class="card">

<h1>Prólogo</h1>

<p>

O mundo está sob o domínio de tiranos.

O Trono Divino consome a energia da humanidade.

Evolua até o nível 1000.

Desafie o Deus atual.

Decida o destino do mundo.

</p>

<div class="buttons">

<button onclick="back()">
Voltar
</button>

<button onclick="next('classe')">
Continuar
</button>

</div>

</div>
</div>

<div id="classe" class="screen">

<div class="card">

<h1>Escolha sua Classe</h1>

<div class="option-grid">

<div class="option"
onclick="selectOption(this,'classe','Guerreiro')">

⚔️
<h3>Guerreiro</h3>

</div>

<div class="option"
onclick="selectOption(this,'classe','Mago')">

🔮
<h3>Mago</h3>

</div>

<div class="option"
onclick="selectOption(this,'classe','Arqueiro')">

🏹
<h3>Arqueiro</h3>

</div>

</div>

<div class="buttons">

<button onclick="back()">Voltar</button>

<button onclick="next('sexo')">
Continuar
</button>

</div>

</div>
</div>

<script>

const stack=[];

const player={

 nome:"",
 sexo:"",
 classe:"",
 lado:""

};

function next(id){

 document
 .querySelector('.active')
 .classList
 .remove('active');

 stack.push(id);

 document
 .getElementById(id)
 .classList
 .add('active');
}

function back(){

 if(stack.length<2)return;

 stack.pop();

 let previous=
 stack[stack.length-1];

 document
 .querySelector('.active')
 .classList
 .remove('active');

 document
 .getElementById(previous)
 .classList
 .add('active');
}

function selectOption(
 element,
 field,
 value
){

 element.parentElement
 .querySelectorAll('.option')
 .forEach(
 e=>e.classList.remove('selected')
 );

 element.classList.add('selected');

 player[field]=value;

 localStorage.setItem(
 'legendWolfPlayer',
 JSON.stringify(player)
 );
}

</script>

</body>
</html>
