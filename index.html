<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Wolf Legends: Seleção</title>
    <style>
        body { background: #1a1a1a; color: #FFD700; text-align: center; font-family: 'Arial', sans-serif; padding: 20px; }
        .box { border: 3px solid #800080; padding: 20px; border-radius: 15px; display: inline-block; background: #000; }
        button { background: #800080; color: white; border: none; padding: 10px 20px; margin: 5px; cursor: pointer; border-radius: 5px; }
        input { padding: 10px; margin: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Wolf Legends RPG</h1>
        <input type="text" id="nome" placeholder="Digite seu nome"><br>
        
        <h3>Escolha seu Guardião:</h3>
        <button onclick="iniciar('Anjo')">Anjo</button>
        <button onclick="iniciar('Demônio')">Demônio</button>

        <h3>Gênero:</h3>
        <button onclick="definirGenero('Gay')">🌈 Gay</button>
        
        <div id="status" style="margin-top: 20px;"></div>
    </div>

    <script>
        let jogador = { nome: "", guardiao: "", genero: "", nivel: 1000, ouro: 999999, diamante: 999999 };

        function iniciar(g) {
            jogador.nome = document.getElementById('nome').value || "Lobo";
            jogador.guardiao = g;
            alert("Bem-vindo, " + jogador.nome + "! Você é um " + g + " de elite.");
        }

        function definirGenero(gen) {
            jogador.genero = gen;
            document.getElementById('status').innerHTML = `
                <h2>Status do Jogador</h2>
                <p>Nome: ${jogador.nome}</p>
                <p>Guardião: ${jogador.guardiao}</p>
                <p>Nível: ${jogador.nivel} | Ouro: ${jogador.ouro} | Diamantes: ${jogador.diamante}</p>
                <p>Bandeira: 🏳️‍🌈</p>
                <button style="background:gold; color:black;">Iniciar Aventura</button>
            `;
        }
    </script>
</body>
</html>
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Wolf Legends RPG</title>
    <style>
        body { background: #1a1a1a; color: #FFD700; text-align: center; font-family: 'Arial', sans-serif; padding: 20px; }
        #game-container { border: 3px solid #800080; padding: 20px; border-radius: 15px; display: inline-block; background: #000; width: 90%; max-width: 500px; }
        button { background: #800080; color: white; border: none; padding: 12px 20px; margin: 8px; cursor: pointer; border-radius: 8px; font-weight: bold; }
        input { padding: 10px; margin: 10px; border-radius: 5px; border: 1px solid #555; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menu-inicial">
        <h1>Wolf Legends RPG</h1>
        <input type="text" id="nome" placeholder="Digite seu nome"><br>
        <h3>Escolha seu Guardião:</h3>
        <button onclick="selecionar('Anjo')">Anjo</button>
        <button onclick="selecionar('Demônio')">Demônio</button>
        <div id="genero-area" class="hidden">
            <h3>Gênero:</h3>
            <button onclick="finalizar('Gay')">🏳️‍🌈 Gay</button>
        </div>
    </div>

    <div id="status-jogo" class="hidden">
        <h2>Status do Herói</h2>
        <p id="info-jogador"></p>
        <hr style="border: 1px solid #800080;">
        <button onclick="irParaMapa()">Iniciar Aventura</button>
    </div>
</div>

<script>
    let jogador = { nome: "", guardiao: "", genero: "", nivel: 1000, ouro: 999999, diamante: 999999 };

    function selecionar(guardiao) {
        jogador.nome = document.getElementById('nome').value || "Lobo";
        jogador.guardiao = guardiao;
        document.getElementById('genero-area').classList.remove('hidden');
    }

    function finalizar(genero) {
        jogador.genero = genero;
        document.getElementById('menu-inicial').classList.add('hidden');
        document.getElementById('status-jogo').classList.remove('hidden');
        document.getElementById('info-jogador').innerHTML = `
            Nome: ${jogador.nome} <br>
            Guardião: ${jogador.guardiao} <br>
            Nível: ${jogador.nivel} <br>
            Ouro: ${jogador.ouro} | Diamantes: ${jogador.diamante}
        `;
    }

    function irParaMapa() {
        alert("Bem-vindo ao mundo de Wolf Legends! Sua jornada começa agora.");
    }
</script>

</body>
</html>
