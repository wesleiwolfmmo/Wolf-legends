<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Wolf Legends Online - Estúdio</title>
    <style>
        :root { --dark: #020617; --gold: #FFD700; --purple: #800080; }
        body { background-color: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .box { border: 2px solid var(--purple); padding: 25px; border-radius: 15px; width: 90%; max-width: 450px; background: rgba(0,0,0,0.9); text-align: center; }
        button { background: var(--purple); color: white; border: 1px solid var(--gold); padding: 15px; margin: 8px 0; cursor: pointer; border-radius: 8px; width: 100%; font-weight: bold; }
        .back-btn { background: #333; border: none; padding: 8px; width: 60px; font-size: 12px; }
        h1 { color: var(--gold); }
        .tag { background: gold; color: black; padding: 2px 5px; border-radius: 3px; font-size: 12px; }
    </style>
</head>
<body>

<div id="app" class="box"></div>

<script>
    // 1. Módulo: Configuração do Jogador (Modo Deus)
    let player = JSON.parse(localStorage.getItem('WolfSave')) || {
        nome: "", classe: "", sexo: "", alinhamento: "", tagGay: false,
        nivel: 1000, poder: 999999999, ouro: "Infinito", diamantes: "Infinito"
    };

    let history = []; // Pilha para o botão voltar

    function render(html, saveHistory = true) {
        if(saveHistory) history.push(app.innerHTML);
        document.getElementById('app').innerHTML = html;
    }

    function voltar() { if(history.length > 0) document.getElementById('app').innerHTML = history.pop(); }
    
    function playVoice(texto, personagem) { console.log(`[Áudio]: ${personagem} - ${texto}`); }

    // 2. Módulos de Fluxo
    function iniciar() {
        render(`
            <h1>Wolf Legends</h1>
            <p>O mundo está sob o domínio de tiranos que criam o caos para serem adorados. O trono é um dreno de energia. Evolua até o nível 1000, desafie o Deus atual e decida o destino: Liberdade ou Tirania.</p>
            <button onclick="telaCriacao()">Continuar</button>
        `, false);
    }

    function telaCriacao() {
        render(`
            <button class="back-btn" onclick="voltar()">Voltar</button>
            <input type="text" id="nomeInput" placeholder="Nome do Herói" style="padding:10px; width:90%">
            <h3>Classe:</h3>
            <button onclick="definir('classe', 'Guerreiro')">Guerreiro</button>
            <button onclick="definir('classe', 'Mago')">Mago</button>
            <button onclick="definir('classe', 'Arqueiro')">Arqueiro</button>
            <h3>Orientação:</h3>
            <button onclick="definir('sexo', 'Gay')">Gay <span class="tag">🏳️‍🌈</span></button>
            <button onclick="definir('sexo', 'Masculino')">Masculino</button>
            <button onclick="definir('sexo', 'Feminino')">Feminino</button>
        `);
    }

    function definir(key, val) {
        player[key] = val;
        if(key === 'sexo' && val === 'Gay') player.tagGay = true;
        player.nome = document.getElementById('nomeInput').value || "Lobo";
        hub();
    }

    function hub() {
        localStorage.setItem('WolfSave', JSON.stringify(player));
        playVoice("Bem-vindo ao Hub.", "Sistema");
        render(`
            <h2>Hub de Comando</h2>
            <p>Herói: ${player.nome} (${player.classe})</p>
            <p>Nível: ${player.nivel} | Poder: ${player.poder}</p>
            <p>Ouro/Dia: ${player.ouro} / ${player.diamantes}</p>
            ${player.tagGay ? '<p><span class="tag">🏳️‍🌈 Tag de Identidade Ativa</span></p>' : ''}
            <button onclick="location.reload()">Resetar Save</button>
        `, false);
    }

    iniciar();
</script>
</body>
</html>
