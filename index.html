<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Wolf Legends: Seleção</title>
    <style>
        body { background: #1a1a1a; color: #FFD700; text-align: center; font-family: 'Arial', sans-serif; padding: 20px; }
        .box { border: 3px solid #800080; padding: 20px; border-radius: 15px; display: inline-block; background: #000; }
        button { background: #800080; color: white; border: none; padding: 10px 20px; margin: 5px; cursor: pointer; border-radius: 5px; }
        input { padding: 10px; margin: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Wolf Legends RPG</h1>
        <input type="text" id="nome" placeholder="Digite seu nome"><br>
        
        <h3>Escolha seu Guardião:</h3>
        <button onclick="iniciar('Anjo')">Anjo</button>
        <button onclick="iniciar('Demônio')">Demônio</button>

        <h3>Gênero:</h3>
        <button onclick="definirGenero('Gay')">🌈 Gay</button>
        
        <div id="status" style="margin-top: 20px;"></div>
    </div>

    <script>
        let jogador = { nome: "", guardiao: "", genero: "", nivel: 1000, ouro: 999999, diamante: 999999 };

        function iniciar(g) {
            jogador.nome = document.getElementById('nome').value || "Lobo";
            jogador.guardiao = g;
            alert("Bem-vindo, " + jogador.nome + "! Você é um " + g + " de elite.");
        }

        function definirGenero(gen) {
            jogador.genero = gen;
            document.getElementById('status').innerHTML = `
                <h2>Status do Jogador</h2>
                <p>Nome: ${jogador.nome}</p>
                <p>Guardião: ${jogador.guardiao}</p>
                <p>Nível: ${jogador.nivel} | Ouro: ${jogador.ouro} | Diamantes: ${jogador.diamante}</p>
                <p>Bandeira: 🏳️‍🌈</p>
                <button style="background:gold; color:black;">Iniciar Aventura</button>
            `;
        }
    </script>
</body>
</html>
